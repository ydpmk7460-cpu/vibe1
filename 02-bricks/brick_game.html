<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>냥냥 간식 대작전</title>
  <link rel="stylesheet" href="brick_game.css?v=4">
</head>
<body>
  <main class="game-shell" aria-label="냥냥 간식 대작전 게임">
    <header class="game-header">
      <div class="title-group">
        <span class="title-paw" aria-hidden="true">🐾</span>
        <div>
          <h1>냥냥 간식 대작전</h1>
          <p id="statusText">스페이스키를 눌러 시작하세요!</p>
        </div>
      </div>

      <section class="hud" aria-label="게임 정보">
        <div class="fullness-wrap">
          <div class="hud-label">
            <span>포만도</span>
            <strong id="fullnessText">0 / 100</strong>
          </div>
          <div class="fullness-track" role="progressbar" aria-label="고양이 포만도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="fullnessBar" class="fullness-bar"></div>
          </div>
        </div>
        <div class="lives" aria-label="남은 목숨">
          <span>남은 공</span>
          <strong id="livesText">● ● ●</strong>
        </div>
        <div class="timer" aria-label="진행 시간">
          <span>시간</span>
          <strong id="timerText">0.0초</strong>
        </div>
        <button id="soundButton" class="sound-button" type="button" aria-pressed="false">🔊 소리 켬</button>
      </section>
    </header>

    <div class="game-content">
      <section class="play-area">
        <canvas id="gameCanvas" width="880" height="570" aria-label="벽돌깨기 게임 화면"></canvas>

        <div id="overlay" class="overlay">
          <div class="overlay-card">
            <div id="overlayIcon" class="overlay-icon" aria-hidden="true">🐱</div>
            <h2 id="overlayTitle">게임 닉네임을 정해 주세요</h2>
            <p id="overlayMessage">실제 이름 대신 재미있는 별명을 사용해 주세요!</p>
            <div id="nameForm" class="name-form">
              <label for="nicknameInput">게임 닉네임</label>
              <div>
                <input id="nicknameInput" type="text" maxlength="10" autocomplete="off" placeholder="예: 초코냥" aria-describedby="nameError">
                <button id="nameButton" type="button">확인</button>
              </div>
              <small id="nameError" aria-live="polite"></small>
            </div>
            <button id="restartButton" class="restart-button hidden" type="button">다시 하기 <kbd>Space</kbd></button>
          </div>
        </div>
      </section>

      <aside class="records-panel" aria-label="게임 기록">
        <div class="current-player">도전자 <strong id="playerText">-</strong></div>
        <section>
          <h2>🏆 상위 10개</h2>
          <ol id="topRecords" class="record-list top-records"></ol>
        </section>
        <section class="all-section">
          <h2>📚 전체 기록 <span id="recordCount">0개</span></h2>
          <ol id="allRecords" class="record-list all-records"></ol>
        </section>
      </aside>
    </div>

    <footer class="game-help">
      <span><kbd>←</kbd> <kbd>→</kbd> 또는 <kbd>A</kbd> <kbd>D</kbd> 이동</span>
      <span><kbd>Space</kbd> 공 출발</span>
      <span>먹이: 사료 +5 · 간식 +10 · 츄르 +20</span>
    </footer>
  </main>

  <script src="brick_game.js?v=4"></script>
</body>
</html>

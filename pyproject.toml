[project]
name = "workspace1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "docx>=0.2.4",
    "folium>=0.20.0",
    "google-genai>=2.7.0",
    "kiwipiepy>=0.24.1",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "openai>=3.50.0",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "print>=1.3.0",
    "pydantic>=2.14.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "tiktoken>=0.14.0",
    "wikipedia-api>=0.16.0",
    "wordcloud>=1.9.6",
    "youtube-transcript-api>=1.2.5",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
workspace1 = "workspace1:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
